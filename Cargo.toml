[package]
name = "excel-sp"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.98"
calamine = "0.29.0"
dialoguer = "0.11.0"
rfd = "0.15.4"
xlsxwriter = "0.6.1"
indicatif = "0.18.0"
console = "*"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
